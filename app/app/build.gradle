plugins {
    id 'com.android.application'
}

android {
    namespace 'com.invoiceapp.manager'
    compileSdk 34

    defaultConfig {
        applicationId "com.invoiceapp.manager"
        minSdk 24
        targetSdk 34
        versionCode 12
        versionName "12"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
